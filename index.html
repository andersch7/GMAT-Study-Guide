  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('gmatCoach.v1') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    })();
  </script>

</head>
